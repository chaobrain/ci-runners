# The host inventory, schema 1 (design §3.3). This file holds placeholders only: the
# real one is <data>/ci-runners/etc/inventory.toml on each host, in a mode-700
# directory, and is never committed. `python -m ci_runners.inventory check FILE`
# validates it; `... deny FILE etc/policy.toml` prints the hashes for tests/deny.sha256.
# Every string value except `this`, `memory_max`, `cpus`, `compile_cpus`,
# `default_project`, a pool's `labels`, `class` and `audience`, a slot's `memory` and
# `isa`, and the `files` paths is treated as inventory by the deny list. The first path's keys (ssh, trusted, remote, cpu_slowdown,
# proxy) are accepted and ignored (decision 11.12). A 3090 host's `files` name
# brainspike's host lock and slot files (`host_lock`, `slot_lock`, `slot_queue`), and its
# `default_project` the project of their slot tickets, which name none (decision 12.9);
# its `local_accounts` (a list) the accounts that share those files, for the plan's root
# steps, and its `push_key` the org snapshot's push key (`ssh-ed25519 ...`, decision 12.4).
# A host without `files.host_lock` has no host lock, and keeps its slot files under state/.
schema = 1
this = "3090b"                                  # the role of the host that reads it

[hosts.3090b]                                   # a 3090 host, its own CI account (decision 12.2)
account = "<ci account>"
home = "/home/<ci account>"
data = "/<data disk>/<ci account>"              # the root of design §3.2
slots = 2                                       # CPU slots; each card is its own slot
memory_max = "120G"                             # ci.slice
disk_min_gib = 50
gpus = [0, 1]
max_temp_c = 80
cpus = "0-27"
compile_cpus = "4-15"                           # the compile parts' CPUs (decision 12.7)
default_project = "brainspike"                  # the project of a ci_slot.sh ticket (decision 12.9)
python = "/<path to a Python 3.11 or later>"    # export it as CI_RUNNERS_PYTHON (and CI_RUNNERS_ETC)
                                                # to run setup/*.sh by hand
# orgsync = true                                # only a host with its own token: the 3090 hosts'
                                                # snapshot is pushed from the workstation (12.4)
# local_accounts = ["<local account>"]          # the root steps that share the files (§5.3)
# push_key = "ssh-ed25519 <key>"                # the snapshot push's key (decision 12.4)
# probe_key = "ssh-ed25519 <key>"               # the other host's CI account's pool probe key (15.1, item 8);
#                                               # a list of them, one per calling host, from 15.8
# isolation = "ns-subuid"                      # decision 18.2 (from C2): the public pool's backend, account
#                                               # or ns-subuid; accepted and inert until a later phase
# presence = { enabled = false, tick_seconds = 20, infra_failures = 3 }  # decision 16.4 (from R3): enabled =
#                                               # true stops and starts idle runners by their resources, one
#                                               # host at a time; false is the rollback (operations §15)
# the other host's pool of each class: where a drained or busy part goes (decision 13.3)
peer_labels = { light = ["3090a-light"], part = ["3090a-cpu"], gpu = ["3090a-gpu"], multi = ["3090a-multi"] }

[hosts.3090b.tunnel]                            # the egress (decisions 11.10, 12.3)
http_port = 18182                               # ci-tunnel's forward on 127.0.0.1: the runners' https_proxy
egress_port = 18443                             # ci-egress.service on the egress host's 127.0.0.1
# no_proxy of the runners: localhost, and a package mirror that answers directly. Every
# GitHub name goes through the egress; its allowlist is the egress host's
# (setup/egress/allow). Public names only here (these values are not denied in the repository).
direct = ["localhost", "127.0.0.1", "::1"]

[hosts.3090b.pools]                             # this host's own labels (§5.1)
light = { count = 2, labels = ["3090b-light"] }
part = { count = 3, labels = ["3090b-cpu"] }
cards = { per_card = true, class = "gpu", labels = ["3090b-gpu"] }  # runners 3090b-gpu<N>
multi = { count = 1, labels = ["3090b-multi"] }
compile = { count = 1, labels = ["3090b-compile"] }
# From RUN-10's R1 (decision 16.3) a pool may hold `slot` (16.2) and `audience` (16.7), and a
# host `presence` (above, 16.4): accepted and checked for shape; `audience` is inert until P1
# (the public pool); `presence` acts from R3 where `enabled = true`. A slot table has one cpuset per runner (per card
# for a per-card pool, in the order of `gpus`), no CPU in two; setup writes CI_RUNNER_SLOT=<i>,
# the runner's index in `cpus` from 0, into its .env. From R2 a part on that runner is pinned
# to `cpus[i]` (CI_CPUS), capped at `memory` (at most the registry's maximum), gets
# CI_WORKERS=`workers`, CI_SPEED=`speed` (per worker, how many times slower than the reference
# host, 1.0 there) and CI_ISA=`isa` where set, and its inner timeout is its minutes x `speed`;
# a CPU part still takes a CI slot from `files` until v2 (sizing: docs/operations.md §14).
# No host's inventory gains these keys before `v1` accepts them.
# part = { count = 3, labels = ["3090b-cpu"], audience = "private", slot = { cpus = ["16-19", "20-23", "24-27"], workers = 4, memory = "40G", speed = 1.0, isa = "x86-64-v3" } }
# From C2 (decision 18.7) a host that offers the public audience names its public pool: per card,
# class gpu, audience public, on the cards of its own gpu pool (shared through the leases), with
# no count or slot (its runners come from the issuer, 18.6) and the labels ci-pub-gpu and
# <role>-pub-gpu only; it needs the host's `isolation`. Accepted, checked and ignored by setup,
# presence, the route and the executor until a later phase; no private pool carries a ci-pub- label.
# pub-gpu = { per_card = true, class = "gpu", audience = "public", labels = ["ci-pub-gpu", "3090b-pub-gpu"] }

[hosts.3090b.files]                             # brainspike's lock and slot files (decision 12.9)
host_lock = "/tmp/brainspike-host.lock"
slot_lock = "/tmp/brainspike-local-ci.lock"
slot_queue = "/tmp/brainspike-local-ci.queue"
# lease_dir = "/tmp/ci-gpu-leases"              # the GPU leases, shared with pool runs (15.1); default state/leases
