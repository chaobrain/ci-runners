name: ci-runners flow
description: One step of the reusable workflow ci.yml and part.yml (design 16.6, §4.10), run from this action's own checkout; not for consumers' own workflows.
inputs:
  command:
    description: start, claim, contract, plan, pending, retry, locate, fetch or status (ci_runners/flow.py); admit and verdict for a public caller (public.yml)
    required: true
  context:
    description: the status context (start, claim, contract, plan, pending, status)
    default: ''
  sha:
    description: the head (start, claim, contract, plan, pending, status)
    default: ''
  default-branch:
    description: the repository's default branch (start, contract; empty reads it from the API)
    default: ''
  project:
    description: the registry key (plan, retry; empty in start, the repository's name)
    default: ''
  plan-file:
    description: the plan command's standard output (plan; empty is the plan of one pytest part)
    default: ''
  plan-outcome:
    description: the plan command's part outcome (plan; empty where no plan command ran)
    default: ''
  plan-reason:
    description: that outcome's reason (plan)
    default: ''
  plan-only:
    description: true for a plan-only run (plan; in start, no claim)
    default: ''
  workspace:
    description: the checkout the plan's files are below (plan), or the part's checkout to check (fetch)
    default: ''
  part:
    description: the routed part, JSON (retry)
    default: ''
  outcome-file:
    description: the first attempt's outcome.json (retry; empty or missing is lost)
    default: ''
  fallback-file:
    description: another outcome.json read where the first holds none of this run attempt (retry)
    default: ''
  role:
    description: the host role of the first attempt where its outputs are lost (retry)
    default: ''
  part-id:
    description: the part whose first attempt to locate (locate)
    default: ''
  seen:
    description: the newest of the runners' statuses the claim read, epoch seconds (pending)
    default: ''
  state:
    description: failure, error or success (status)
    default: ''
  description:
    description: the status description (status)
    default: ''
  parts:
    description: the ids of the parts the run started, space-separated (verdict)
    default: ''
  dest:
    description: the new directory the plan's files go to (fetch; empty for the check alone, with no files)
    default: ''
  token:
    description: the job's token (statuses read to claim, write to post; contents read for the contract; actions read to locate and fetch)
    default: ${{ github.token }}
outputs:
  run:
    description: "true or false, the claim's decision (start, claim)"
    value: ${{ steps.flow.outputs.run }}
  reason:
    description: "why (start, claim)"
    value: ${{ steps.flow.outputs.reason }}
  seen:
    description: "the newest of the runners' statuses read, epoch seconds, 0.0 for none (start, claim)"
    value: ${{ steps.flow.outputs.seen }}
  ok:
    description: "true where the head's contract holds and the plan command may run (start, contract)"
    value: ${{ steps.flow.outputs.ok }}
  project:
    description: "the registry key: the project input, else the repository's name (start)"
    value: ${{ steps.flow.outputs.project }}
  state:
    description: "the run's end where this step ends it, for the verdict job to post (start, contract, plan)"
    value: ${{ steps.flow.outputs.state }}
  description:
    description: "that end's status description (start, contract, plan)"
    value: ${{ steps.flow.outputs.description }}
  routed:
    description: "true where the plan has parts to run (plan)"
    value: ${{ steps.flow.outputs.routed }}
  posted:
    description: "true where pending was posted (pending)"
    value: ${{ steps.flow.outputs.posted }}
  parts:
    description: "the routed parts, a JSON array: the matrix of part.yml (plan)"
    value: ${{ steps.flow.outputs.parts }}
  ids:
    description: "the part ids, space-separated (plan)"
    value: ${{ steps.flow.outputs.ids }}
  files:
    description: "the plan's files directory below the checkout, or empty (plan)"
    value: ${{ steps.flow.outputs.files }}
  max-parallel:
    description: "the registry's max_parallel, lowered by the plan's (plan)"
    value: ${{ steps.flow.outputs.max_parallel }}
  retry:
    description: "the retry as JSON (labels, timeout_minutes, target, resume, attempt_of, row, why), or none (retry)"
    value: ${{ steps.flow.outputs.retry }}
  labels:
    description: "the salvage leg's labels, a JSON array, or empty where the host is not known (locate)"
    value: ${{ steps.flow.outputs.labels }}
  role:
    description: "the first attempt's host role, or empty (locate)"
    value: ${{ steps.flow.outputs.role }}
  fallback:
    description: "true where the plan's files could not be read through the API, so that download-artifact downloads them (fetch)"
    value: ${{ steps.flow.outputs.fallback }}
runs:
  using: composite
  steps:
    - id: flow
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        IN_COMMAND: ${{ inputs.command }}
        IN_CONTEXT: ${{ inputs.context }}
        IN_SHA: ${{ inputs.sha }}
        IN_DEFAULT_BRANCH: ${{ inputs.default-branch }}
        IN_PROJECT: ${{ inputs.project }}
        IN_PLAN_FILE: ${{ inputs.plan-file }}
        IN_PLAN_OUTCOME: ${{ inputs.plan-outcome }}
        IN_PLAN_REASON: ${{ inputs.plan-reason }}
        IN_PLAN_ONLY: ${{ inputs.plan-only }}
        IN_WORKSPACE: ${{ inputs.workspace }}
        IN_PART: ${{ inputs.part }}
        IN_OUTCOME_FILE: ${{ inputs.outcome-file }}
        IN_FALLBACK_FILE: ${{ inputs.fallback-file }}
        IN_ROLE: ${{ inputs.role }}
        IN_PART_ID: ${{ inputs.part-id }}
        IN_SEEN: ${{ inputs.seen }}
        IN_STATE: ${{ inputs.state }}
        IN_DESCRIPTION: ${{ inputs.description }}
        IN_PARTS: ${{ inputs.parts }}
        IN_DEST: ${{ inputs.dest }}
      run: |
        case "$IN_COMMAND" in start|claim|contract|plan|pending|retry|locate|fetch|status|admit|verdict) ;; *) echo "::error::ci-runners flow: unknown command '$IN_COMMAND'"; exit 2;; esac
        args=()
        [ -z "$IN_CONTEXT" ] || args+=("--context=$IN_CONTEXT")
        [ -z "$IN_SHA" ] || args+=("--sha=$IN_SHA")
        [ -z "$IN_DEFAULT_BRANCH" ] || args+=("--default-branch=$IN_DEFAULT_BRANCH")
        [ -z "$IN_PROJECT" ] || args+=("--project=$IN_PROJECT")
        [ -z "$IN_PLAN_FILE" ] || args+=("--plan-file=$IN_PLAN_FILE")
        [ -z "$IN_PLAN_OUTCOME" ] || args+=("--plan-outcome=$IN_PLAN_OUTCOME")
        [ -z "$IN_PLAN_REASON" ] || args+=("--plan-reason=$IN_PLAN_REASON")
        [ -z "$IN_PLAN_ONLY" ] || args+=("--plan-only=$IN_PLAN_ONLY")
        [ -z "$IN_WORKSPACE" ] || args+=("--workspace=$IN_WORKSPACE")
        [ -z "$IN_PART" ] || args+=("--part=$IN_PART")
        [ -z "$IN_OUTCOME_FILE" ] || args+=("--outcome-file=$IN_OUTCOME_FILE")
        [ -z "$IN_FALLBACK_FILE" ] || args+=("--outcome-file=$IN_FALLBACK_FILE")
        [ -z "$IN_ROLE" ] || args+=("--role=$IN_ROLE")
        [ -z "$IN_PART_ID" ] || args+=("--part-id=$IN_PART_ID")
        [ -z "$IN_SEEN" ] || args+=("--seen=$IN_SEEN")
        [ -z "$IN_STATE" ] || args+=("--state=$IN_STATE")
        [ -z "$IN_DESCRIPTION" ] || args+=("--description=$IN_DESCRIPTION")
        [ "$IN_COMMAND" != verdict ] || args+=("--parts=$IN_PARTS")
        [ -z "$IN_DEST" ] || args+=("--dest=$IN_DEST")
        # this action's own checkout, the release the workflow names (design §9), not the host's
        exec sh "$GITHUB_ACTION_PATH/../../bin/ci-run" flow "$IN_COMMAND" "${args[@]}"
