# The host inventory, schema 1 (design §3.3). This file holds placeholders only: the
# real one is <data>/ci-runners/etc/inventory.toml on each host, in a mode-700
# directory, and is never committed. `python -m ci_runners.inventory check FILE`
# validates it; `... deny FILE etc/policy.toml` prints the hashes for tests/deny.sha256.
# Every string value except `this`, `memory_max`, `cpus` and the `files` paths is
# treated as inventory by the deny list. The first path's keys (ssh, trusted, remote,
# cpu_slowdown, proxy, files.host_lock) are accepted and ignored (decision 11.12).
schema = 1
this = "h100"                                   # the role of the host that reads it

[hosts.h100]                                    # a standalone host (decision 11.3)
account = "<shared account>"
home = "/home/<shared account>"
data = "/home/<shared account>/<our subtree>"   # the root of design §3.2 on h100
slots = 2                                       # CPU slots; each card is its own slot
memory_max = "512G"                             # ci.slice
disk_min_gib = 50
gpus = [0, 1, 2, 3, 4]
max_temp_c = 80
cpus = "0-43,88-131"                            # NUMA node 0
python = "/<path to a Python 3.11 or later>"    # the system's is 3.10; export it as CI_RUNNERS_PYTHON
                                                # (and CI_RUNNERS_ETC) to run setup/*.sh by hand
# orgsync = true                                # only a host with its own token: h100's snapshot is
                                                # pushed from the workstation (decision 11.9)
watchdog_log = "/<path to the GPU watchdog's log>"
watchdog_notice = "/<path to the watchdog's notice file>"   # leave out if the host has none

[hosts.h100.tunnel]                             # the egress (decision 11.10)
http_port = 18182                               # ci-tunnel's forward on 127.0.0.1: the runners' https_proxy
egress_port = 18443                             # ci-egress.service on the egress host's 127.0.0.1
# no_proxy of the runners: localhost, and a package mirror that answers directly. Every
# GitHub name goes through the egress; its allowlist is the egress host's
# (setup/egress/allow). Public names only here (these values are not denied in the repository).
direct = ["localhost", "127.0.0.1", "::1"]

[hosts.h100.pools]                              # h100's own labels (§5.1)
light = { count = 2, labels = ["h100-light"] }
part = { count = 2, labels = ["h100-cpu"] }
h100 = { per_card = true, labels = ["h100"] }   # runners h100-gpu<N>, labelled h100 and h100-gpu<N>

[hosts.h100.files]                              # the CI slots' files, under state/ (§7)
slot_lock = "/home/<shared account>/<our subtree>/ci-runners/state/slot.lock"
slot_queue = "/home/<shared account>/<our subtree>/ci-runners/state/slot.queue"
