name: ci-runners place
description: Choose hosts and cards for a project's parts, from live probes (design §4.2). Runs on light.
inputs:
  parts:
    description: 'JSON list of {id, class: cpu|gpu|compile, gpus, gpu-mem-mib, memory, estimate-minutes}'
    default: ''
  parts-file:
    description: a file holding that list (instead of parts)
    default: ''
  prefer:
    description: 'host order per class, as JSON {class: [hosts]}'
    default: ''
  exclude:
    description: hosts to leave out, comma-separated
    default: ''
outputs:
  plan:
    description: 'JSON list of {id, runs-on, fallback, timeout-minutes}'
    value: ${{ steps.place.outputs.plan }}
runs:
  using: composite
  steps:
    - id: place
      shell: bash
      env:
        IN_PARTS: ${{ inputs.parts }}
        IN_PARTS_FILE: ${{ inputs.parts-file }}
        IN_PREFER: ${{ inputs.prefer }}
        IN_EXCLUDE: ${{ inputs.exclude }}
      run: |
        if [ -n "$IN_PARTS_FILE" ]; then src=(--parts-file "$IN_PARTS_FILE"); else src=(--parts "$IN_PARTS"); fi
        "$GITHUB_ACTION_PATH/../lib/ci-run.sh" place "${src[@]}" --prefer "$IN_PREFER" --exclude "$IN_EXCLUDE"
