[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-runners"
description = "The host layer of chaobrain's shared self-hosted GitHub Actions runners"
requires-python = ">=3.11"
dependencies = []
dynamic = ["version"]

[tool.setuptools.packages.find]
include = ["ci_runners", "ci_runners.*"]

[tool.setuptools.dynamic]
version = {attr = "ci_runners.__version__"}
