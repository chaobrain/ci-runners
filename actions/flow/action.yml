name: ci-runners flow
description: One step of the reusable workflow ci.yml and part.yml (design 16.6, §4.10), run from this action's own checkout; not for consumers' own workflows.
inputs:
  command:
    description: contract, plan, retry, locate or status (ci_runners/flow.py)
    required: true
  context:
    description: the status context (contract, plan, status)
    default: ''
  sha:
    description: the head (contract, plan, status)
    default: ''
  default-branch:
    description: the repository's default branch (contract; empty reads it from the API)
    default: ''
  project:
    description: the registry key (plan, retry)
    default: ''
  plan-file:
    description: the plan command's standard output (plan; empty is the plan of one pytest part)
    default: ''
  plan-outcome:
    description: the plan command's part outcome (plan; empty where no plan command ran)
    default: ''
  plan-reason:
    description: that outcome's reason (plan)
    default: ''
  plan-only:
    description: true for a plan-only run (plan)
    default: ''
  workspace:
    description: the checkout the plan's files are below (plan)
    default: ''
  part:
    description: the routed part, JSON (retry)
    default: ''
  outcome-file:
    description: the first attempt's outcome.json (retry; empty or missing is lost)
    default: ''
  fallback-file:
    description: another outcome.json read where the first holds none of this run attempt (retry)
    default: ''
  role:
    description: the host role of the first attempt where its outputs are lost (retry)
    default: ''
  part-id:
    description: the part whose first attempt to locate (locate)
    default: ''
  state:
    description: failure or error (status)
    default: ''
  description:
    description: the status description (status)
    default: ''
  token:
    description: the job's token (statuses write to post; actions read to locate)
    default: ${{ github.token }}
outputs:
  posted:
    description: "true where this step posted the head's state itself (contract, plan)"
    value: ${{ steps.flow.outputs.posted }}
  parts:
    description: "the routed parts, a JSON array: the matrix of part.yml (plan)"
    value: ${{ steps.flow.outputs.parts }}
  ids:
    description: "the part ids, space-separated (plan)"
    value: ${{ steps.flow.outputs.ids }}
  files:
    description: "the plan's files directory below the checkout, or empty (plan)"
    value: ${{ steps.flow.outputs.files }}
  max-parallel:
    description: "the registry's max_parallel, lowered by the plan's (plan)"
    value: ${{ steps.flow.outputs.max_parallel }}
  retry:
    description: "the retry as JSON (labels, timeout_minutes, target, resume, attempt_of, row, why), or none (retry)"
    value: ${{ steps.flow.outputs.retry }}
  labels:
    description: "the salvage leg's labels, a JSON array, or empty where the host is not known (locate)"
    value: ${{ steps.flow.outputs.labels }}
  role:
    description: "the first attempt's host role, or empty (locate)"
    value: ${{ steps.flow.outputs.role }}
runs:
  using: composite
  steps:
    - id: flow
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        IN_COMMAND: ${{ inputs.command }}
        IN_CONTEXT: ${{ inputs.context }}
        IN_SHA: ${{ inputs.sha }}
        IN_DEFAULT_BRANCH: ${{ inputs.default-branch }}
        IN_PROJECT: ${{ inputs.project }}
        IN_PLAN_FILE: ${{ inputs.plan-file }}
        IN_PLAN_OUTCOME: ${{ inputs.plan-outcome }}
        IN_PLAN_REASON: ${{ inputs.plan-reason }}
        IN_PLAN_ONLY: ${{ inputs.plan-only }}
        IN_WORKSPACE: ${{ inputs.workspace }}
        IN_PART: ${{ inputs.part }}
        IN_OUTCOME_FILE: ${{ inputs.outcome-file }}
        IN_FALLBACK_FILE: ${{ inputs.fallback-file }}
        IN_ROLE: ${{ inputs.role }}
        IN_PART_ID: ${{ inputs.part-id }}
        IN_STATE: ${{ inputs.state }}
        IN_DESCRIPTION: ${{ inputs.description }}
      run: |
        case "$IN_COMMAND" in contract|plan|retry|locate|status) ;; *) echo "::error::ci-runners flow: unknown command '$IN_COMMAND'"; exit 2;; esac
        args=()
        [ -z "$IN_CONTEXT" ] || args+=("--context=$IN_CONTEXT")
        [ -z "$IN_SHA" ] || args+=("--sha=$IN_SHA")
        [ -z "$IN_DEFAULT_BRANCH" ] || args+=("--default-branch=$IN_DEFAULT_BRANCH")
        [ -z "$IN_PROJECT" ] || args+=("--project=$IN_PROJECT")
        [ -z "$IN_PLAN_FILE" ] || args+=("--plan-file=$IN_PLAN_FILE")
        [ -z "$IN_PLAN_OUTCOME" ] || args+=("--plan-outcome=$IN_PLAN_OUTCOME")
        [ -z "$IN_PLAN_REASON" ] || args+=("--plan-reason=$IN_PLAN_REASON")
        [ -z "$IN_PLAN_ONLY" ] || args+=("--plan-only=$IN_PLAN_ONLY")
        [ -z "$IN_WORKSPACE" ] || args+=("--workspace=$IN_WORKSPACE")
        [ -z "$IN_PART" ] || args+=("--part=$IN_PART")
        [ -z "$IN_OUTCOME_FILE" ] || args+=("--outcome-file=$IN_OUTCOME_FILE")
        [ -z "$IN_FALLBACK_FILE" ] || args+=("--outcome-file=$IN_FALLBACK_FILE")
        [ -z "$IN_ROLE" ] || args+=("--role=$IN_ROLE")
        [ -z "$IN_PART_ID" ] || args+=("--part-id=$IN_PART_ID")
        [ -z "$IN_STATE" ] || args+=("--state=$IN_STATE")
        [ -z "$IN_DESCRIPTION" ] || args+=("--description=$IN_DESCRIPTION")
        # this action's own checkout, the release the workflow names (design §9), not the host's
        exec sh "$GITHUB_ACTION_PATH/../../bin/ci-run" flow "$IN_COMMAND" "${args[@]}"
