# This repository's own tests. Hosted runners only: no job here targets a self-hosted
# label (AGENTS.md).
name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  unit:
    name: unit (3.12)  # the ruleset of main requires this check name
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # the hosts' system Python, which runs ci-run; one version only (lead, 2026-11-11)
      - name: unit tests
        run: python -I tests/leaks.py --timeout 900 -- python -I -m unittest discover -s tests -t . -v
      - name: inventory lint
        run: python -m ci_runners.inventory lint . --deny tests/deny.sha256
      - name: mutants
        run: python tests/mutants.py
