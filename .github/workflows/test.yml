# This repository's own tests. Hosted runners only: no job here targets a self-hosted
# label (AGENTS.md).
name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: unit tests
        run: python -I -m unittest discover -s tests -t . -v
      - name: inventory lint
        run: python -m ci_runners.inventory lint . --deny tests/deny.sha256
      - name: mutants
        if: matrix.python == '3.12'
        run: python tests/mutants.py
