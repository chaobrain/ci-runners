[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-runners"
description = "The host layer of chaobrain's shared self-hosted GitHub Actions runners"
requires-python = ">=3.11"
dependencies = []
dynamic = ["version"]

[tool.setuptools]
packages = ["ci_runners", "parallel"]
include-package-data = false

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}

[tool.setuptools.package-data]
parallel = ["deploy.sh", "examples/*.toml", "examples/*.yml", "units/*"]
