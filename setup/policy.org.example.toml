# The hook's policy, schema 2, as on h100 (design §6.5, decisions 11.2, 11.9). Placeholders
# only: the real one is <data>/ci-runners/etc/policy.toml on h100. The org's members join
# the actors, and its private repositories join the repositories, from etc/org.json,
# which the maintainer's workstation pushes every 10 min (ci-run org-sync --receive), or
# ci-orgsync.timer refreshes on a host with its own token. A stale snapshot refuses every job.
schema = 2
bot = "github-actions[bot]"
actors = []                                     # members come from the snapshot
[org]
name = "chaobrain"
members = true
private_repositories = true
max_age_minutes = 60

# A repository listed here keeps this entry over the snapshot's, so the lead can pause
# one, let its bot dispatch, or open the exclusive classes to it (decision 12.14):
# [repositories."chaobrain/a-private-repo"]
# id = 1
# visibility = "private"
# paused = true
# classes = ["compile", "nightly"]               # the hosts' compile and nightly runners
