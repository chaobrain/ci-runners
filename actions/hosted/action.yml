name: ci-runners hosted part
description: A public caller's CPU part on a GitHub-hosted runner (decision 18.7), run from this action's own checkout; public-part.yml's only, not for consumers' own workflows.
inputs:
  id:
    description: the part's name, unique in the run
    required: true
  command:
    description: run with bash -c in the job's checkout
    required: true
  timeout-minutes:
    description: the inner bound, below the job's timeout-minutes
    required: true
  results:
    description: glob of JUnit XML the command writes into CI_RESULTS_DIR
    default: ''
  resume:
    description: sets CI_RESUME=1
    default: 'false'
  attempt-of:
    description: the first attempt this one retries (non-empty makes it attempt 2)
    default: ''
outputs:
  outcome:
    description: "pass or red"
    value: ${{ steps.part.outputs.outcome }}
  reason:
    description: "why"
    value: ${{ steps.part.outputs.reason }}
  attempt:
    description: "the attempt number"
    value: ${{ steps.part.outputs.attempt }}
runs:
  using: composite
  steps:
    - id: part
      shell: bash
      env:
        IN_ID: ${{ inputs.id }}
        IN_COMMAND: ${{ inputs.command }}
        IN_TIMEOUT: ${{ inputs.timeout-minutes }}
        IN_RESULTS: ${{ inputs.results }}
        IN_RESUME: ${{ inputs.resume }}
        IN_ATTEMPT_OF: ${{ inputs.attempt-of }}
      # this action's own checkout, the release the workflow names (design §9): no host layer here
      run: >-
        sh "$GITHUB_ACTION_PATH/../../bin/ci-run" hosted --id "$IN_ID" --command "$IN_COMMAND"
        --timeout-minutes "$IN_TIMEOUT" --results "$IN_RESULTS" --resume "$IN_RESUME" --attempt-of "$IN_ATTEMPT_OF"
    - if: always() && steps.part.outputs.outcome != ''
      uses: actions/upload-artifact@v4
      with:
        name: ci-part-${{ inputs.id }}-${{ steps.part.outputs.attempt || '1' }}
        path: ${{ runner.temp }}/ci-runners/${{ inputs.id }}
        retention-days: 7
