name: Authorized CPU execution
on:
  workflow_call:
    inputs:
      runner_tag:
        description: Unique runner label selected by the scheduler
        type: string
        required: true
      allocation_json:
        description: Authorized allocation, including groups, cores, RAM, workers and time limits
        type: string
        required: true
jobs:
  execute:
    runs-on: [self-hosted, "${{ inputs.runner_tag }}"]
    timeout-minutes: ${{ fromJSON(inputs.allocation_json).job_timeout_minutes }}
    permissions:
      contents: read
      actions: read
    steps:
      - id: allocation
        uses: chaobrain/ci-runners/actions/central@v2.0.0
        with:
          command: inspect
          allocation-json: ${{ inputs.allocation_json }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.allocation.outputs.sha }}
          fetch-depth: ${{ steps.allocation.outputs.fetch_depth }}
          persist-credentials: false
      - uses: chaobrain/ci-runners/actions/central@v2.0.0
        with:
          command: fetch
          token: ${{ github.token }}
      - id: test
        uses: chaobrain/ci-runners/actions/central@v2.0.0
        with:
          command: execute
      - if: always() && steps.allocation.outputs.allocation_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: ci-allocation-${{ steps.allocation.outputs.allocation_id }}
          path: ${{ runner.temp }}/ci-allocation/${{ steps.allocation.outputs.allocation_id }}
          retention-days: 7
          if-no-files-found: warn
