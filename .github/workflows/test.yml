# This repository's own tests. Hosted runners only: no job here targets a self-hosted
# label (AGENTS.md). The unit tests and the mutants' shards run side by side, so that no job
# runs much past 5 min (the mutants took 925 s in one job, 2026-11-13); `unit (3.12)`, the
# check main's ruleset requires, is green only where every one of them is.
name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # the hosts' system Python, which runs ci-run; one version only (lead, 2026-11-11)
      - name: unit tests and inventory lint
        run: |
          python -I tests/leaks.py --timeout 900 -- python -I -m unittest discover -s tests -t . -v
          python -m ci_runners.inventory lint . --deny tests/deny.sha256
  mutants:
    name: mutants (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]  # tests/mutants.py's SHARDS
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: mutants
        run: python tests/mutants.py --shard ${{ matrix.shard }}/4
  unit:
    name: unit (3.12)  # the ruleset of main requires this check name
    needs: [tests, mutants]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          TESTS: ${{ needs.tests.result }}
          MUTANTS: ${{ needs.mutants.result }}
        run: |
          echo "tests: $TESTS, mutants: $MUTANTS"
          [ "$TESTS" = success ] && [ "$MUTANTS" = success ]
